name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ranker
          POSTGRES_PASSWORD: ranker
          POSTGRES_DB: ranker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ranker -d ranker"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # The integration tests create and migrate a separate `ranker_test` database on this server.
      DATABASE_URL: postgres://ranker:ranker@localhost:5432/ranker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
