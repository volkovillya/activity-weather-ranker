# Local development database only. The credentials below are not secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ranker
      POSTGRES_PASSWORD: ranker
      POSTGRES_DB: ranker
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ranker -d ranker']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
